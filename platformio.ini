[platformio]
default_envs = c3_ble, s3_ble

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBRUSH_FW_VERSION_MAJOR=2
    -DBRUSH_FW_VERSION_MINOR=0
    -DBRUSH_FW_VERSION_PATCH=0
    -DARDUINO_LOOP_STACK_SIZE=8192

[env:c3_base]
board = esp32-c3-devkitm-1
board_build.f_cpu = 80000000L
build_src_filter = +<*> -<s3_engine.cpp> -<s3_adaptive.cpp> -<c3_ble_test.cpp> -<s3_ble_test.cpp> -<c3_ble_only.cpp> -<s3_usb_test.cpp> -<serial_test.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:s3_base]
board = esp32-s3-devkitc-1
build_src_filter = +<*> -<c3_node.cpp> -<c3_ble_test.cpp> -<s3_ble_test.cpp> -<c3_ble_only.cpp> -<s3_usb_test.cpp> -<serial_test.cpp>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:c3_ble]
extends = env:c3_base
lib_deps = h2zero/NimBLE-Arduino@2.3.7
build_flags = ${env.build_flags} -DBRUSH_LINK_BLE=1 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3_ble]
extends = env:s3_base
lib_deps = h2zero/NimBLE-Arduino@2.3.7
build_flags = ${env:s3_base.build_flags} -DBRUSH_LINK_BLE=1

[env:c3_wifi]
extends = env:c3_base
build_flags = ${env.build_flags} -DBRUSH_LINK_WIFI=1

[env:s3_wifi]
extends = env:s3_base
build_flags = ${env:s3_base.build_flags} -DBRUSH_LINK_WIFI=1

[env:c3_ble_test]
extends = env:c3_base
lib_deps = h2zero/NimBLE-Arduino@2.3.7
build_src_filter = +<c3_ble_test.cpp>
build_flags = ${env.build_flags} -DBRUSH_LINK_BLE=1

[env:s3_ble_test]
extends = env:s3_base
lib_deps = h2zero/NimBLE-Arduino@2.3.7
build_src_filter = +<s3_ble_test.cpp>
build_flags = ${env:s3_base.build_flags} -DBRUSH_LINK_BLE=1

[env:c3_ble_only]
extends = env:c3_base
lib_deps = h2zero/NimBLE-Arduino@2.3.7
build_src_filter = +<c3_ble_only.cpp>
build_flags = ${env.build_flags} -DBRUSH_LINK_BLE=1

[env:c3_i2c_scan]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
build_src_filter = +<i2c_scan.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3_usb_test]
extends = env:s3_base
lib_deps = h2zero/NimBLE-Arduino@2.3.7
build_src_filter = +<s3_usb_test.cpp>
build_flags = ${env:s3_base.build_flags} -DBRUSH_LINK_BLE=1

[env:c3_serial_test]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_src_filter = +<serial_test.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3_serial_test]
board = esp32-s3-devkitc-1
build_src_filter = +<serial_test.cpp>
lib_deps = h2zero/NimBLE-Arduino@2.3.7
build_flags =
    ${env:s3_base.build_flags}
