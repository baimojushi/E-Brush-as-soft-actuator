[platformio]
default_envs = esp32-s3-devkitc-1-uart

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBRUSH_FW_VERSION_MAJOR=1
    -DBRUSH_FW_VERSION_MINOR=0
    -DBRUSH_FW_VERSION_PATCH=0

; 推荐：与图纸“电脑 USB -> 开发板 USB-UART 上行”一致。
[env:esp32-s3-devkitc-1-uart]

; 备选：开发板若实际使用 ESP32-S3 原生 USB CDC，可切换此环境。
; GPIO19/GPIO20 仍保留给原生 USB，不被传感器代码占用。
[env:esp32-s3-devkitc-1-native-usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBRUSH_NATIVE_USB=1
