; PlatformIO 工程配置 — e-Brush 机载 OLED 监视器
; 板型/框架与 DESIGN_OLED_I2C.md §7 已验证配置一致:
;   espressif32 6.10.0 + esp32-s3-devkitc-1 + Arduino 框架 3.20017
;
; 源文件: oled_monitor.ino (单文件 sketch, PlatformIO 自动识别 .ino 为主文件)
; 依赖: 中景园 font.h (同目录, 无需第三方 OLED 库)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
  -DBOARD_ESP32S3